name: Update AI prices

on:
  schedule:
    # Каждый день в 6:00 UTC (9:00 по Москве)
    - cron: '0 6 * * *'
  # Плюс можно запустить вручную из интерфейса GitHub
  workflow_dispatch:

jobs:
  update:
    runs-on: ubuntu-latest
    permissions:
      contents: write

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '20'

      - name: Update prices
        run: node update-prices.js

      - name: Commit and push if changed
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "github-actions[bot]@users.noreply.github.com"
          git add prices.json
          if git diff --quiet --cached; then
            echo "Цены не изменились - коммит не нужен"
          else
            git commit -m "chore: auto-update AI prices [$(date -u +%Y-%m-%d)]"
            git push
          fi
